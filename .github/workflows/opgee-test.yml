name: OPGEE Tests

on:
  pull_request:
    branches:
      - master
      - main
      - dev
      - refactor-v5

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})

    env:
      OPGEE_HOME: ${{ github.workspace }}/tests/files
      CI: "true"
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test-env

      - name: Run workspace package tests
        run: |
          uv run pytest packages/opgee-input/tests/ -xv
          uv run pytest packages/opgee-xml/tests/ -xv

      - name: Run main tests with coverage
        run: uv run pytest tests/ -xv --cov=opgee --cov-report=xml
