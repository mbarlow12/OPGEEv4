name: OPGEE Unit Tests with Coverage

on:
  pull_request:
    branches:
      - master
      - main
      - dev
      - refactor-v5

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})

    env:
      OPGEE_HOME: ${{ github.workspace }}/tests/files
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install graphviz (Ubuntu)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: graphviz
          version: 1.0

      - name: Cache Homebrew packages (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/graphviz
            /opt/homebrew/Cellar/graphviz
          key: brew-graphviz-${{ runner.os }}

      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz || true

      - name: Cache Chocolatey packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\lib\graphviz
          key: choco-graphviz-${{ runner.os }}

      - name: Install graphviz (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path "C:\ProgramData\chocolatey\lib\graphviz")) {
            choco install graphviz -y
          }

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Run workspace package tests
        run: |
          uv run pytest packages/opgee-input/tests/ -xv
          uv run pytest packages/opgee-xml/tests/ -xv

      - name: Run main tests with coverage
        run: uv run pytest tests/ -xv --cov=opgee --cov-report=xml
