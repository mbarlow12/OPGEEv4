[project]
name = "opgee-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Michael Barlow", email = "mbarlow@rmi.org" }]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.5",
    "pandas>=2.3.1",
    "pint>=0.24.4",
    "pint-pandas>=0.6.2",
    "pluggy>=1.5.0",
    "pyxsteam>=0.4.9",
    "thermosteam>=0.51.17",
]

[build-system]
requires = ["uv_build>=0.7.21,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opgee.core"

[tool.uv]
package = true
