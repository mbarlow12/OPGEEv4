[project]
name = "opgee-input"
version = "0.1.0"
description = "Input specification for OPGEE models"
readme = "README.md"
authors = [{ name = "Michael Barlow", email = "mbarlow@rmi.org" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12.5", "pint>=0.24.3"]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
