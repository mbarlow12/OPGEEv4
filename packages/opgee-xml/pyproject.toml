[project]
name = "opgee-xml"
version = "0.1.0"
description = "Parse and validate XML input for OPGEE"
readme = "README.md"
authors = [{ name = "Michael Barlow", email = "mbarlow@rmi.org" }]
requires-python = ">=3.12"
dependencies = ["lxml>=5.3.0", "opgee-input"]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
opgee-input = { workspace = true }

[tool.setuptools.package-data]
opgee_xml = ["*.xml", "*.xsd"]
