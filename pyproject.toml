[project]
name = "opgee"
version = "4.0.1a1"
description = "Python 3 package implementing life cycle analysis of oil fields"
authors = [
  { name = "Michael Barlow", email = "mbarlow@rmi.org" },
  { name = "Richard Plevin", email = "rich@plevin.com" },
]
requires-python = ">=3.12"
readme = "README.md"
license-files = ["LICENSE.txt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/RMI/OPGEEv4"
Downloads = "https://github.com/RMI/OPGEEv4.git"

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (skip unless --run-slow is passed)"]

[tool.uv]
package = true

[tool.uv.workspace]
members = [
  "packages/engine",
  "packages/core",
  "packages/graph",
  "packages/processes",
  "packages/thermo",
  "packages/data",
  "packages/field",
  "packages/metrics",
  "packages/stream",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.8",
    "ty>=0.0.15",
    "typing-extensions>=4.15.0",
]
