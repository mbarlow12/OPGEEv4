[project]
name = "opgee"
version = "4.0.1a1"
description = "Python 3 package implementing life cycle analysis of oil fields"
authors = [
  { name = "Michael Barlow", email = "mbarlow@rmi.org" },
  { name = "Richard Plevin", email = "rich@plevin.com" },
]
dependencies = [
  "dash>=2.18.1",
  "dash-cytoscape>=1.0.2",
  "dask>=2024.10.0",
  "dask-jobqueue>=0.9.0",
  "lxml>=5.3.0",
  "networkx>=3.4.2",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "pint>=0.24.3",
  "pint-pandas>=0.6.2",
  "pydot>=3.0.2",
  "pyxsteam>=0.4.9",
  "scipy>=1.14.1",
  "thermosteam>=0.45.0",
]
requires-python = ">=3.11"
readme = "README.md"
license-files = ["LICENSE.txt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/RMI/OPGEEv4"
Downloads = "https://github.com/RMI/OPGEEv4.git"

[project.scripts]
opg = "opgee.tool:main"

[tool.uv.workspace]
members = ["opgee_thermo"]

[tool.uv.sources]
opgee-thermo = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.11.8",
    "sphinx>=8.1.3",
    "sphinx-argparse>=0.5.2",
    "sphinx-rtd-theme>=3.0.1",
]
