[project]
name = "opgee"
version = "4.0.1a1"
description = "Python 3 package implementing life cycle analysis of oil fields"
authors = [
  { name = "Michael Barlow", email = "mbarlow@rmi.org" },
  { name = "Richard Plevin", email = "rich@plevin.com" },
]
dependencies = ["opgee-core", "opgee-legacy"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/RMI/OPGEEv4"
Downloads = "https://github.com/RMI/OPGEEv4.git"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
opgee-core = { workspace = true }
opgee-legacy = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.11.8"]

[tool.ty.src]
include = ["src", "tests", "packages/*/src"]
