[project]
name = "opgee"
version = "4.0.1a1"
description = "Python 3 package implementing life cycle analysis of oil fields"
authors = [
  { name = "Michael Barlow", email = "mbarlow@rmi.org" },
  { name = "Richard Plevin", email = "rich@plevin.com" },
]
dependencies = [
  "chemicals>=1.2.0",
  "fluids>=1.0.26",
  "networkx>=3.4.2",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "pint>=0.24.3",
  "pint-pandas==0.6.2",
  "pyxsteam>=0.4.9",
  "scipy>=1.14.1",
  "thermo>=0.3.0",
  "thermosteam>=0.45.0",
]
requires-python = ">=3.12"
readme = "README.md"
license-files = ["LICENSE.txt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/RMI/OPGEEv4"
Downloads = "https://github.com/RMI/OPGEEv4.git"

[tool.setuptools.packages.find]
include = ["opgee*"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (skip unless --run-slow is passed)"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0", "ruff>=0.11.8", "ty>=0.0.15"]
docs = ["sphinx>=8.1.3", "sphinx-argparse>=0.5.2", "sphinx-rtd-theme>=3.0.1"]
